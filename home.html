<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudiCalendar - 学生向け学習管理＆カレンダー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
                    <i class="fa-solid fa-[# graduation-cap]"></i>
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">StudiCalendar</h1>
                    <p class="text-xs text-slate-500">学生向け学習スケジュール管理</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="openVacationModal()" class="inline-flex items-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 rounded-lg transition border border-amber-200">
                    <i class="fa-solid fa-umbrella-beach"></i>
                    <span class="hidden sm:inline">長期休暇設定</span>
                </button>
                <button onclick="openEventModal()" class="inline-flex items-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-medium text-white bg-sky-600 hover:bg-sky-700 rounded-lg transition shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>予定・試験を追加</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- アラート / カウントダウンダッシュボード -->
        <section id="countdownDashboard" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- JSで動的にカウントダウンカードが挿入されます -->
        </section>

        <!-- カレンダーメインカード -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- カレンダー操作ヘッダー -->
            <div class="p-4 sm:p-6 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <h2 id="calendarMonthLabel" class="text-xl sm:text-2xl font-bold text-slate-800">2026年 8月</h2>
                    <div class="flex items-center bg-slate-100 rounded-lg p-1">
                        <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-white rounded-md text-slate-600 hover:text-slate-900 transition">
                            <i class="fa-solid fa-chevron-left text-sm"></i>
                        </button>
                        <button onclick="goToToday()" class="px-2.5 py-1 text-xs font-semibold hover:bg-white rounded-md text-slate-700 transition">
                            今日
                        </button>
                        <button onclick="changeMonth(1)" class="p-1.5 hover:bg-white rounded-md text-slate-600 hover:text-slate-900 transition">
                            <i class="fa-solid fa-chevron-right text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- 凡例 (Legend) -->
                <div class="flex items-center flex-wrap gap-3 text-xs text-slate-600">
                    <span class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> 祝日
                    </span>
                    <span class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span> 夏休み等休暇
                    </span>
                    <span class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> 試験日
                    </span>
                    <span class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span> 課題・宿題
                    </span>
                </div>
            </div>

            <!-- 曜日ヘッダー -->
            <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50/50 text-center text-xs font-bold text-slate-500">
                <div class="py-3 text-red-500">日</div>
                <div class="py-3">月</div>
                <div class="py-3">火</div>
                <div class="py-3">水</div>
                <div class="py-3">木</div>
                <div class="py-3">金</div>
                <div class="py-3 text-blue-500">土</div>
            </div>

            <!-- カレンダー日付グリッド -->
            <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-100 bg-slate-100">
                <!-- JSで日付セルが生成されます -->
            </div>
        </div>

        <!-- 長期休暇一覧パネル -->
        <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-umbrella-beach text-amber-500"></i>
                    <span>登録中の長期休暇（夏休み・冬休みなど）</span>
                </h3>
            </div>
            <div id="vacationList" class="flex flex-wrap gap-2">
                <!-- JSで表示 -->
            </div>
        </div>
    </main>

    <!-- モーダル: 予定・試験の追加/編集 -->
    <div id="eventModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeEventModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-regular fa-calendar-plus text-sky-600"></i>
                <span>予定・試験の追加</span>
            </h3>

            <form id="eventForm" onsubmit="saveEvent(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">タイトル</label>
                    <input type="text" id="eventTitle" required placeholder="例: 期末テスト（数学）、夏休みの宿題提出" 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">日付</label>
                        <input type="date" id="eventDate" required 
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">区分</label>
                        <select id="eventType" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="exam">🎯 試験・テスト</option>
                            <option value="homework">📝 課題・宿題</option>
                            <option value="event">🎈 イベント・補習</option>
                            <option value="other">📌 その他</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">メモ</label>
                    <textarea id="eventMemo" rows="2" placeholder="範囲や持ち物などを入力..." 
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeEventModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">キャンセル</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow transition">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- モーダル: 長期休暇の設定 -->
    <div id="vacationModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 relative">
            <button onclick="closeVacationModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-umbrella-beach text-amber-500"></i>
                <span>長期休暇の設定</span>
            </h3>

            <form id="vacationForm" onsubmit="saveVacation(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">休暇名</label>
                    <input type="text" id="vacationTitle" required placeholder="例: 夏休み、冬休み、GW" 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">開始日</label>
                        <input type="date" id="vacationStart" required 
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">終了日</label>
                        <input type="date" id="vacationEnd" required 
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeVacationModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">キャンセル</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-amber-500 hover:bg-amber-600 rounded-lg shadow transition">登録する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- モーダル: 日付詳細 & 曜日API検証表示 -->
    <div id="dayDetailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 relative">
            <button onclick="closeDayDetailModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div class="border-b border-slate-100 pb-3 mb-4">
                <div class="text-xs font-semibold text-sky-600" id="detailDateDisplay">2026/08/25</div>
                <h3 class="text-xl font-bold text-slate-800 flex items-center justify-between" id="detailTitle">
                    <span>日付の詳細</span>
                </h3>
            </div>

            <!-- APIレスポンス情報エリア -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4 text-xs space-y-1">
                <div class="font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-globe text-sky-500"></i>
                    <span>外部API取得データ</span>
                </div>
                <div class="text-slate-600" id="detailApiWeekday">
                    曜日API: <span class="animate-pulse">取得中...</span>
                </div>
                <div class="text-slate-600" id="detailHolidayStatus">
                    祝日情報: なし
                </div>
            </div>

            <!-- その日の予定一覧 -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-500">予定・試験一覧</span>
                    <button onclick="addEventOnSelectedDate()" class="text-xs text-sky-600 font-semibold hover:underline">
                        + この日に予定を追加
                    </button>
                </div>
                <div id="detailEventsList" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- JSで挿入 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- アプリデータ管理 ---
        let currentDate = new Date(); // 現在表示中のカレンダーの年月基準
        let holidaysData = {}; // 祝日APIデータ { 'YYYY-MM-DD': '祝日名' }
        let events = JSON.parse(localStorage.getItem('studi_events') || '[]');
        let vacations = JSON.parse(localStorage.getItem('studi_vacations') || '[]');
        let selectedDateStr = ''; // 現在選択されている日付 'YYYY-MM-DD'

        // 曜日テキスト定義
        const WEEKDAYS_JP = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];

        // --- 初期化処理 ---
        window.onload = async function() {
            await fetchHolidays();
            renderCalendar();
            renderDashboard();
            renderVacationsList();
        };

        // --- 祝日API取得 (holidays-jp) ---
        async function fetchHolidays() {
            try {
                const response = await fetch('https://holidays-jp.github.io/api/v1/date.json');
                if (response.ok) {
                    holidaysData = await response.json();
                }
            } catch (err) {
                console.warn('祝日APIの取得に失敗しました。ローカル動作を継続します。', err);
            }
        }

        // --- 曜日取得API呼び出し (aijimy API) ---
        async function fetchWeekdayFromApi(dateStr) {
            // dateStr: YYYY-MM-DD -> yyyymmdd
            const formattedParam = dateStr.replace(/-/g, '');
            const apiUrl = `https://api.aijimy.com/get?code=get-weekday&text=${formattedParam}`;
            
            try {
                const res = await fetch(apiUrl);
                if (res.ok) {
                    const text = await res.text();
                    return text.trim();
                }
            } catch (e) {
                console.warn('曜日API呼び出しエラー、JavaScriptで代替計算します。', e);
            }

            // API通信失敗時のフォールバック処理 (JavaScript Date)
            const d = new Date(dateStr + 'T00:00:00');
            return WEEKDAYS_JP[d.getDay()];
        }

        // --- カレンダー描画 ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // 月ヘッダー更新
            document.getElementById('calendarMonthLabel').textContent = `${year}年 ${month + 1}月`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 当月1日の曜日と最終日を取得
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            
            // 前月の埋め草
            const prevMonthLastDate = new Date(year, month, 0).getDate();
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevMonthLastDate - i;
                const cell = createCellElement(dayNum, true);
                grid.appendChild(cell);
            }

            // 当月の日付
            const todayStr = new Date().toISOString().split('T')[0];

            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const cell = createCellElement(day, false, dateKey);

                // 今日のハイライト
                if (dateKey === todayStr) {
                    cell.classList.add('bg-sky-50/70', 'font-semibold');
                }

                // 休暇（夏休み等）判定
                const inVacation = vacations.find(v => dateKey >= v.start && dateKey <= v.end);
                if (inVacation) {
                    cell.classList.add('bg-amber-50/60');
                    const vacBadge = document.createElement('div');
                    vacBadge.className = 'text-[10px] font-medium text-amber-700 bg-amber-100/80 px-1 py-0.5 rounded mb-1 truncate';
                    vacBadge.textContent = inVacation.title;
                    cell.querySelector('.cell-content').appendChild(vacBadge);
                }

                // 祝日判定
                if (holidaysData[dateKey]) {
                    const holidayBadge = document.createElement('div');
                    holidayBadge.className = 'text-[10px] text-red-600 bg-red-50 px-1 py-0.5 rounded truncate font-medium mb-1 border border-red-100';
                    holidayBadge.textContent = `🎌 ${holidaysData[dateKey]}`;
                    cell.querySelector('.cell-content').appendChild(holidayBadge);
                }

                // イベント/試験バッジの追加
                const dayEvents = events.filter(e => e.date === dateKey);
                dayEvents.forEach(e => {
                    const badge = document.createElement('div');
                    let colorClass = 'bg-slate-100 text-slate-700';
                    if (e.type === 'exam') colorClass = 'bg-rose-500 text-white font-semibold';
                    else if (e.type === 'homework') colorClass = 'bg-indigo-500 text-white';
                    else if (e.type === 'event') colorClass = 'bg-emerald-500 text-white';

                    badge.className = `text-[10px] px-1.5 py-0.5 rounded truncate shadow-xs mb-0.5 ${colorClass}`;
                    badge.textContent = e.title;
                    cell.querySelector('.cell-content').appendChild(badge);
                });

                grid.appendChild(cell);
            }

            // 翌月の埋め草
            const totalCells = firstDayIndex + totalDays;
            const nextDays = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= nextDays; i++) {
                const cell = createCellElement(i, true);
                grid.appendChild(cell);
            }
        }

        // セル要素生成ヘルパー
        function createCellElement(dayNumber, isOtherMonth, dateKey = null) {
            const cell = document.createElement('div');
            cell.className = `min-h-[90px] sm:min-h-[110px] bg-white p-1.5 sm:p-2 transition hover:bg-slate-50 cursor-pointer flex flex-col justify-between ${isOtherMonth ? 'opacity-40 bg-slate-50/50' : ''}`;
            
            const header = document.createElement('div');
            header.className = 'flex justify-between items-center mb-1';
            
            const numSpan = document.createElement('span');
            numSpan.className = `text-xs sm:text-sm font-medium ${isOtherMonth ? 'text-slate-400' : 'text-slate-700'}`;
            numSpan.textContent = dayNumber;
            header.appendChild(numSpan);

            const content = document.createElement('div');
            content.className = 'cell-content flex-1 overflow-hidden';

            cell.appendChild(header);
            cell.appendChild(content);

            if (!isOtherMonth && dateKey) {
                cell.onclick = () => openDayDetailModal(dateKey);
            }

            return cell;
        }

        // --- カレンダー操作 ---
        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        // --- ダッシュボード（試験カウントダウン機能） ---
        function renderDashboard() {
            const dashboard = document.getElementById('countdownDashboard');
            dashboard.innerHTML = '';

            const todayStr = new Date().toISOString().split('T')[0];
            
            // 未来の試験イベントをフィルタ＆ソート
            const upcomingExams = events
                .filter(e => e.type === 'exam' && e.date >= todayStr)
                .sort((a, b) => a.date.localeCompare(b.date));

            if (upcomingExams.length === 0) {
                dashboard.innerHTML = `
                    <div class="col-span-full bg-gradient-to-r from-sky-500 to-indigo-600 rounded-2xl p-5 text-white shadow-md flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-lg">現在、予定されている試験はありません 🎯</h3>
                            <p class="text-xs opacity-90 mt-1">「予定・試験を追加」ボタンから次の定期テストや模試を追加してみましょう！</p>
                        </div>
                        <button onclick="openEventModal()" class="px-4 py-2 bg-white text-sky-600 font-bold text-xs rounded-xl shadow hover:bg-sky-50 transition">
                            予定を追加
                        </button>
                    </div>
                `;
                return;
            }

            // 直近最大3件の試験を表示
            upcomingExams.slice(0, 3).forEach((exam, idx) => {
                const diffTime = new Date(exam.date) - new Date(todayStr);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-5 border border-rose-100 shadow-sm relative overflow-hidden flex flex-col justify-between';
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-24 h-24 bg-rose-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">試験カウントダウン</span>
                            <span class="text-xs text-slate-400">${exam.date}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-base truncate mb-1">${exam.title}</h4>
                        <p class="text-xs text-slate-500 line-clamp-1">${exam.memo || 'メモなし'}</p>
                    </div>
                    <div class="mt-4 flex items-baseline justify-between border-t border-slate-100 pt-3">
                        <span class="text-xs text-slate-500">本番まで</span>
                        <div>
                            <span class="text-2xl font-black text-rose-600">${diffDays === 0 ? '本日！' : diffDays}</span>
                            ${diffDays > 0 ? '<span class="text-xs text-slate-600 font-bold ml-0.5">日</span>' : ''}
                        </div>
                    </div>
                `;
                dashboard.appendChild(card);
            });
        }

        // --- 日付詳細モーダル ---
        async function openDayDetailModal(dateStr) {
            selectedDateStr = dateStr;
            const modal = document.getElementById('dayDetailModal');
            document.getElementById('detailDateDisplay').textContent = dateStr;
            
            // 祝日表示の更新
            const holidayStatus = document.getElementById('detailHolidayStatus');
            if (holidaysData[dateStr]) {
                holidayStatus.innerHTML = `祝日情報: <span class="font-bold text-red-600">🎌 ${holidaysData[dateStr]}</span>`;
            } else {
                holidayStatus.textContent = '祝日情報: 平日/通常の休日';
            }

            // 曜日APIからデータ取得
            const apiWeekdaySpan = document.getElementById('detailApiWeekday');
            apiWeekdaySpan.innerHTML = '曜日API: <span class="animate-pulse text-sky-600">取得中...</span>';
            modal.classList.remove('hidden');

            const weekdayRes = await fetchWeekdayFromApi(dateStr);
            apiWeekdaySpan.innerHTML = `曜日API取得結果: <span class="font-bold text-slate-800">${weekdayRes}</span>`;

            // その日のイベント描画
            renderDayEventsList(dateStr);
        }

        function renderDayEventsList(dateStr) {
            const list = document.getElementById('detailEventsList');
            list.innerHTML = '';
            const dayEvents = events.filter(e => e.date === dateStr);

            if (dayEvents.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 py-2">この日の予定はありません。</p>`;
                return;
            }

            dayEvents.forEach((e) => {
                const item = document.createElement('div');
                item.className = 'p-2.5 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-between text-xs';
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800">${e.title}</div>
                        ${e.memo ? `<div class="text-slate-500 text-[11px] mt-0.5">${e.memo}</div>` : ''}
                    </div>
                    <button onclick="deleteEvent('${e.id}')" class="text-red-400 hover:text-red-600 p-1">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function closeDayDetailModal() {
            document.getElementById('dayDetailModal').classList.add('hidden');
        }

        function addEventOnSelectedDate() {
            closeDayDetailModal();
            openEventModal(selectedDateStr);
        }

        // --- 予定の追加/保存 ---
        function openEventModal(defaultDate = '') {
            document.getElementById('eventForm').reset();
            if (defaultDate) {
                document.getElementById('eventDate').value = defaultDate;
            } else {
                document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
            }
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        function saveEvent(e) {
            e.preventDefault();
            const newEvent = {
                id: 'evt_' + Date.now(),
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                type: document.getElementById('eventType').value,
                memo: document.getElementById('eventMemo').value,
            };

            events.push(newEvent);
            localStorage.setItem('studi_events', JSON.stringify(events));

            closeEventModal();
            renderCalendar();
            renderDashboard();
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            localStorage.setItem('studi_events', JSON.stringify(events));
            renderCalendar();
            renderDashboard();
            if (selectedDateStr) renderDayEventsList(selectedDateStr);
        }

        // --- 長期休暇の設定/保存 ---
        function openVacationModal() {
            document.getElementById('vacationForm').reset();
            document.getElementById('vacationModal').classList.remove('hidden');
        }

        function closeVacationModal() {
            document.getElementById('vacationModal').classList.add('hidden');
        }

        function saveVacation(e) {
            e.preventDefault();
            const start = document.getElementById('vacationStart').value;
            const end = document.getElementById('vacationEnd').value;

            if (start > end) {
                alert('開始日は終了日より前の日付を指定してください。');
                return;
            }

            const newVacation = {
                id: 'vac_' + Date.now(),
                title: document.getElementById('vacationTitle').value,
                start: start,
                end: end
            };

            vacations.push(newVacation);
            localStorage.setItem('studi_vacations', JSON.stringify(vacations));

            closeVacationModal();
            renderCalendar();
            renderVacationsList();
        }

        function renderVacationsList() {
            const list = document.getElementById('vacationList');
            list.innerHTML = '';

            if (vacations.length === 0) {
                list.innerHTML = '<span class="text-xs text-slate-400">長期休暇（夏休み・冬休みなど）が設定されていません。</span>';
                return;
            }

            vacations.forEach(v => {
                const item = document.createElement('div');
                item.className = 'inline-flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg';
                item.innerHTML = `
                    <span class="font-bold">${v.title}:</span>
                    <span>${v.start} 〜 ${v.end}</span>
                    <button onclick="deleteVacation('${v.id}')" class="text-amber-500 hover:text-amber-800 ml-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function deleteVacation(id) {
            vacations = vacations.filter(v => v.id !== id);
            localStorage.setItem('studi_vacations', JSON.stringify(vacations));
            renderCalendar();
            renderVacationsList();
        }
    </script>
</body>
</html>
